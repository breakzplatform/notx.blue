<!doctype html>
<!-- Source for og.png and share.png. Render at 1200x630 with scripts/build-social.sh.
     Same card as the apps (sumidos.notx.blue/scripts/og.html): the wordmark with the
     name on the ink block tilted, and the tagline on a halftone shadow. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>notx.blue social preview</title>
<link rel="stylesheet" href="../assets/tailwind-4.3.3.css">
<link rel="stylesheet" href="../assets/site-v2.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--surface-page); }
  .frame {
    box-sizing: border-box; width: 1200px; height: 630px; padding: 56px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 52px;
    isolation: isolate;
  }
  .wordmark {
    margin: 0;
    font: 700 136px/1.1 var(--font-display);
    letter-spacing: -0.02em;
    color: var(--text-1);
    white-space: nowrap;
  }
  .ink-block {
    display: inline-block; background: var(--ink-blue); color: var(--on-blue);
    padding: 0.06em 0.07em 0.1em; line-height: 0.92; transform: rotate(1.5deg);
  }
  .tagline {
    position: relative; margin: 0; padding: 14px 22px;
    background: var(--surface-card); border: 3px solid var(--border-strong);
    font: 700 28px/1.3 var(--font-mono);
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-1);
  }
  .tagline::after {
    content: ""; position: absolute; z-index: -1; inset: 0; transform: translate(10px, 10px);
    background: radial-gradient(circle at 50% 50%, var(--text-1) 2px, transparent 2.5px) 0 0 / 6px 6px;
  }
</style>
</head>
<body>
  <div class="frame">
    <h1 class="wordmark"><span class="ink-block">!X</span>.blue</h1>
    <p class="tagline">Projetos para o Bluesky</p>
  </div>
  <script>document.fonts.load('700 136px "CMU Serif"').then(() => document.fonts.ready)</script>
</body>
</html>
