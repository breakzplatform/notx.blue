<!doctype html>
<!-- Source for og.png and share.png. Render at 1200x630 with scripts/build-social.sh.
     The !X mark alone, large, on the ink block tilted. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>notx.blue social preview</title>
<link rel="stylesheet" href="../assets/tailwind-4.3.3.css">
<link rel="stylesheet" href="../assets/site-v2.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--surface-page); }
  .frame {
    box-sizing: border-box; width: 1200px; height: 630px; padding: 56px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 52px;
  }
  .wordmark {
    margin: 0;
    font: 700 340px/1.1 var(--font-display);
    letter-spacing: -0.02em;
    color: var(--text-1);
    white-space: nowrap;
  }
  .ink-block {
    display: inline-block; background: var(--ink-blue); color: var(--on-blue);
    padding: 0.06em 0.07em 0.1em; line-height: 0.92; transform: rotate(1.5deg);
  }
</style>
</head>
<body>
  <div class="frame">
    <h1 class="wordmark"><span class="ink-block">!X</span></h1>
  </div>
  <script>document.fonts.load('700 340px "CMU Serif"').then(() => document.fonts.ready)</script>
</body>
</html>
